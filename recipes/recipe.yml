---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
version: 1
name: k01-os
description: Bazzite (GNOME, nvidia) + Hyprland/Ambxst baked in (niri kept as fallback session), with Kali and Arch/AUR distrobox containers provisioned on first boot.
base-image: ghcr.io/ublue-os/bazzite-gnome-nvidia
image-version: stable

modules:
  # Runs before the dnf module below: it copies in
  # etc/yum.repos.d/sachesi-hyprland-guiutils.repo, which the dnf module
  # needs already in place to install hyprland-guiutils from it.
  - type: files
    files:
      - source: system_files
        destination: /

  - type: dnf
    repos:
      copr:
        - avengemedia/danklinux
        - ashbuk/Hyprland-Fedora
        # zirconium/packages doesn't actually publish mpvpaper (empty repo
        # as of 2026-08-23) despite being the name Ambxst's installer
        # expects; caoturkey/Celestia does, with a fedora-44 build.
        - caoturkey/Celestia
    install:
      packages:
        # niri kept installed as a fallback session (session picker on GDM)
        # until Hyprland+Ambxst has survived a few reboots.
        - niri
        - matugen
        - quickshell
        - qt5ct
        - qt6ct
        - zsh
        # Runtime libs for Noctalia shell (compiled by the user outside the
        # image, kept in $HOME; these three are the only deps not already
        # covered by the base Bazzite/GNOME/niri stack).
        - libnghttp3
        - libqalculate
        - tomlplusplus
        # Wallpaper setter backing the HyprQuickPaper-style picker.
        - swaybg
        # Hyprland session (new default). Ambxst (shell) and hyprglaze
        # (shader wallpaper daemon) are installed by the user outside the
        # image via their own installers, same pattern as Noctalia above.
        - hyprland
        - hyprlock
        - hypridle
        - xdg-desktop-portal-hyprland
        # Toolchain hyprglaze needs to build itself from source ($HOME).
        - zig
        # --- Ambxst shell deps (github.com/Axenide/Ambxst) ---
        # Its own installer runs "dnf install" at first-run, which Bazzite's
        # dnf wrapper hard-blocks on an ostree host (see docs.bazzite.gg) —
        # so every package its Fedora branch would install is baked here
        # instead, and the installer is run locally with that step skipped.
        # (matugen, quickshell already covered above; R-CRAN-phosphoricons
        # skipped — install_phosphor_fonts() in the script fetches the
        # actual font directly, no need for the CRAN copr/package.)
        - tmux
        - fuzzel
        - network-manager-applet
        - blueman
        - easyeffects
        - playerctl
        - qt6-qtbase
        - qt6-qtdeclarative
        - qt6-qtwayland
        - qt6-qtsvg
        - qt6-qttools
        - qt6-qtimageformats
        - qt6-qtmultimedia
        - qt6-qtshadertools
        - kf6-syntax-highlighting
        - kf6-breeze-icons
        - brightnessctl
        - ddcutil
        - grim
        - slurp
        - ImageMagick
        - upower
        - wl-clipboard
        - wlsunset
        - wtype
        - zbar
        - pipx
        - zenity
        - python3.12
        - tesseract
        - tesseract-langpack-eng
        - tesseract-langpack-spa
        - tesseract-langpack-jpn
        - tesseract-langpack-chi_sim
        - tesseract-langpack-chi_tra
        - tesseract-langpack-kor
        - tesseract-langpack-lat
        - google-roboto-fonts
        - google-roboto-mono-fonts
        - dejavu-sans-fonts
        - liberation-fonts
        - google-noto-fonts-common
        - google-noto-cjk-fonts
        - google-noto-emoji-fonts
        - mpvpaper
        - adw-gtk3-theme
        - unzip
        # inotify-tools: backs ambxst-hyprland-lua-fix.service (~/.local/bin),
        # a workaround for a bug in Ambxst's generator that occasionally
        # writes an invalid general.col.inactive_border, which otherwise
        # shows as a permanent "config has errors" banner.
        - inotify-tools
        # --- hyprglaze build deps (github.com/slastra/hyprglaze) ---
        # Compiled from source in $HOME via "zig build" (zig already above);
        # these are its system C deps (wayland/GL/audio headers), Fedora
        # names for the Arch PKGBUILD's wayland/mesa/libglvnd/stb/libpulse.
        # mesa-libGL-devel/mesa-libEGL-devel deliberately omitted: they
        # require an exact-version mesa-libGL/mesa-libEGL that this nvidia
        # base image excludes by design (GL/EGL come from the nvidia driver
        # stack instead); libglvnd-devel alone already ships the GL/EGL
        # headers (/usr/include/GL, /usr/include/EGL), which is all a build
        # needs.
        - wayland-devel
        - wayland-protocols-devel
        - libglvnd-devel
        - stb-devel
        - pulseaudio-libs-devel
        # --- hyprexpo plugin build deps (via hyprpm, ships with hyprland) ---
        - cmake
        - ninja-build
        # Runtime dep for some Hyprland dialogs (the "consider installing
        # it" config-error banner); real package name is hyprland-guiutils,
        # only shipped by sachesi/hyprland (fedora-44 build) among the
        # coprs available here. Pulled from a hand-rolled, includepkgs-
        # restricted repo file (see the files module above) instead of an
        # ordinary "copr:" entry, since that project also builds "hyprland"
        # and "xdg-desktop-portal-hyprland" and an unrestricted repo would
        # make dnf's solver free to pick those over ashbuk's builds.
        - hyprland-guiutils

  - type: systemd
    system:
      enabled:
        - k01-first-boot-setup.service
