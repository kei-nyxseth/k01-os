---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
version: 1
name: k01-os
description: Bazzite (GNOME, nvidia) + niri/DankMaterialShell baked in, with Kali and Arch/AUR distrobox containers provisioned on first boot.
base-image: ghcr.io/ublue-os/bazzite-gnome-nvidia
image-version: stable

modules:
  - type: dnf
    repos:
      copr:
        - avengemedia/danklinux
        - avengemedia/dms
    install:
      packages:
        - niri
        - dms
        - matugen
        - quickshell
        - qt5ct
        - qt6ct
        - zsh
        # Runtime libs for Noctalia shell (compiled by the user outside the
        # image, kept in $HOME; these three are the only deps not already
        # covered by the base Bazzite/GNOME/niri stack).
        - libnghttp3
        - libqalculate
        - tomlplusplus
        # Wallpaper setter backing the HyprQuickPaper-style picker.
        - swaybg

  - type: files
    files:
      - source: system_files
        destination: /

  - type: systemd
    system:
      enabled:
        - k01-first-boot-setup.service
